<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body data-page="after">
<div class="flag" aria-hidden="true"></div>
<header class="top">
  <div class="bar">
    <a class="brand" href="index.html"><svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5l3 7.3 7.9.6-6 5.1 1.9 7.7L12 18l-6.8 4.2 1.9-7.7-6-5.1 7.9-.6z"/></svg>Texas × F1</a>
    <div class="tools">
      <select class="who" id="me" aria-label="Who are you?"></select>
      <button class="icon-btn" id="theme" aria-label="Toggle light or dark"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Pages"></nav>
</header>
<main class="wrap">
<section class="view">
  <div><div class="eyebrow">When everyone is home</div><h2>How was it?</h2>
    <p class="lede" style="margin-top:6px">One page each. Write yours once you are back, and everyone's notes unlock on the memory wall after you post.</p></div>
  <div class="card" id="journalform"></div>
  <div><h3 style="margin-bottom:8px">Memory wall <span class="pill" id="wallcount"></span></h3><div class="grid" id="wall"></div></div>
</section>
</main>
<div class="toast" id="toast" hidden></div>
<form name="journal" data-netlify="true" netlify-honeypot="bot" hidden><input name="person"><input name="stars"><input name="best"><input name="funny"><input name="food"><input name="change"><input name="note"><input name="bot"></form>
<script src="app.js"></script>
</body>
</html>
