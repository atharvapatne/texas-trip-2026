<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Texas × F1 | Who are you?</title>
<meta name="description" content="Pick your driver to enter the pit lane.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23BF5700' stroke='%232A1608' stroke-width='1.5' d='M12 1.5l3 7.3 7.9.6-6 5.1 1.9 7.7L12 18l-6.8 4.2 1.9-7.7-6-5.1 7.9-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="gate">
<div class="flag" aria-hidden="true" style="margin-inline:-16px"></div>
<main class="gate">
  <div style="width:84px"><svg style="width:84px;height:84px" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11c1 9 7 11 13 9M37 11c-1 9-7 11-13 9" stroke="#2A1608" stroke-width="7"/><path d="M3 11c1 9 7 11 13 9M37 11c-1 9-7 11-13 9" stroke="#FFFDF6" stroke-width="3"/></g><path d="M12 17h16l-2 14c-1 4-11 4-12 0z" fill="#BF5700" stroke="#2A1608" stroke-width="3" stroke-linejoin="round"/><circle cx="16.5" cy="23" r="1.6" fill="#2A1608"/><circle cx="23.5" cy="23" r="1.6" fill="#2A1608"/><path d="M33 3l1.2 2.7 2.8.3-2.1 1.9.6 2.8-2.5-1.5-2.5 1.5.6-2.8-2.1-1.9 2.8-.3z" fill="#FFC933" stroke="#2A1608" stroke-width="1"/></svg></div>
  <div><div class="eyebrow">US Grand Prix · Austin · Oct 22–27</div><h1>Who's driving?</h1></div>
  <p class="lede" style="margin-inline:auto">Tap your name to enter the pit lane. You only do this once on each phone.</p>
  <div class="picks" id="picks"></div>
  <p class="small">Wrong person? You can switch any time from the menu at the top of every page.</p>
  <span class="small">Made with love from Austin, Texas</span>
</main>
<script>
(function(){
var P=[['patne','AP','Patne','Atharva Patne','pc1'],['tanmay','TD','Tanmay','Tanmay Dighe','pc2'],['hetvi','HR','Hetvi','Hetvi Rajani','pc3'],['ambika','AV','Ambika','Ambika Varma','pc4'],['anu','AY','Anu','Anukriti Yadav','pc5']];
var me='';try{me=JSON.parse(localStorage.getItem('cota.me')||'""')}catch(e){}
var box=document.getElementById('picks');
box.innerHTML=P.map(function(p){return '<button class="pick'+(p[0]===me?' me':'')+'" data-id="'+p[0]+'"><span class="dot '+p[4]+'">'+p[1]+'</span><b>'+p[2]+'</b><small>'+(p[0]===me?'Welcome back!':p[3])+'</small></button>'}).join('');
box.addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;try{localStorage.setItem('cota.me',JSON.stringify(b.dataset.id))}catch(x){}location.href='home.html'});
})();
</script>
</body>
</html>
